name: Comment Payload Report on PR

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      end_date:
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - "fee_allocator/payloads/*.json"

jobs:
  comment-report:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Get PR details
        if: ${{ inputs.pr_number }}
        id: pr-details
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ inputs.pr_number }}
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr-details.outputs.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const endDate = '${{ inputs.end_date }}';
            
            if (!endDate) {
              console.log('No end_date provided, skipping report comment');
              return;
            }
            
            const reportPath = `fee_allocator/reports/${endDate}.md`;

            if (!fs.existsSync(reportPath)) {
              console.log(`Report file not found: ${reportPath}`);
              return;
            }

            let reportContent = fs.readFileSync(reportPath, 'utf8');

            // Truncate if too large
            if (reportContent.length > 60000) {
              reportContent = reportContent.substring(0, 60000) + '\n\n*Report truncated due to size limits*';
            }

            // Determine PR number from either workflow_call or pull_request_target
            const pr_number = '${{ inputs.pr_number }}' || (context.issue ? context.issue.number : null);

            if (!pr_number) {
              console.log('No PR number found');
              return;
            }

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              issue_number: pr_number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## Fee Allocator Payload Report')
            );

            const body = `## Fee Allocator Payload Report\n\n${reportContent}\n\n---\n<sub>This comment is automatically generated and will be updated when the payload changes.</sub>`;

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: pr_number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
