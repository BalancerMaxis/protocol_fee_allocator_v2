name: Comment Payload Report on PR

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'fee_allocator/payloads/*.json'

jobs:
  comment-report:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Find report
        id: find-report
        run: |
          # Find the most recent markdown report
          REPORT_PATH=$(ls -t fee_allocator/reports/*.md 2>/dev/null | head -n 1)
          
          if [ -n "$REPORT_PATH" ]; then
            echo "report_path=$REPORT_PATH" >> $GITHUB_OUTPUT
          else
            echo "report_path=" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const reportPath = '${{ steps.find-report.outputs.report_path }}';
            
            if (!reportPath) {
              console.log('No report found or generated');
              return;
            }
            
            let reportContent = fs.readFileSync(reportPath, 'utf8');
            
            // Truncate if too large
            if (reportContent.length > 60000) {
              reportContent = reportContent.substring(0, 60000) + '\n\n*Report truncated due to size limits*';
            }
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('## Fee Allocator Payload Report')
            );
            
            const body = `## Fee Allocator Payload Report\n\n${reportContent}\n\n---\n<sub>This comment is automatically generated and will be updated when the payload changes.</sub>`;
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

